<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class Notify</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <p class="eyebrow">Carleton course monitor</p>
          <h1>Class Notify</h1>
        </div>
        <button id="checkAll" type="button">Check Now</button>
      </section>

      <section class="workspace">
        <form id="monitorForm" class="panel">
          <div class="field wide">
            <label for="termCode">Semester</label>
            <select id="termCode" name="termCode" required>
              <option value="">Loading terms...</option>
            </select>
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" value="PHYS" maxlength="4" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="number">Course Number</label>
            <input id="number" name="number" value="1902" maxlength="5" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="section">Section</label>
            <input id="section" name="section" value="V" maxlength="4" autocomplete="off">
          </div>

          <div class="field">
            <label for="notifyEmail">Email</label>
            <input id="notifyEmail" name="notifyEmail" type="email" autocomplete="email" placeholder="optional">
          </div>

          <div class="field">
            <label for="notifyPhone">Message Number</label>
            <input id="notifyPhone" name="notifyPhone" autocomplete="tel" placeholder="+16135550123">
          </div>

          <button class="primary" type="submit">Add Monitor</button>
        </form>

        <section class="panel list-panel">
          <div class="list-header">
            <h2>Watching</h2>
            <span id="statusText">Ready</span>
          </div>
          <div id="monitors" class="monitors"></div>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
